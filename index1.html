<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Result System 2026</title>


<!-- =====================================================
     QR CODE LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f4f6;
    text-align:center;
    margin:0;
    color:#111;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:white;
    padding:12px;
    color:black;
    font-size:22px;
    font-weight:bold;
}


/* =====================================================
   NAVIGATION
===================================================== */

.topnav{
    background:#222;
    padding:10px;
}

.topnav a{
    color:white;
    text-decoration:none;
    padding:10px 15px;
    display:inline-block;
    border-radius:5px;
}

.topnav a:hover{
    background:green;
}


/* =====================================================
   CLASS LINKS
===================================================== */

.class-box{
    margin-top:20px;
}

.class-box a{
    display:inline-block;
    padding:10px 15px;
    margin:5px;
    background:gray;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.class-box a:hover{
    background:#333;
}


/* =====================================================
   SEARCH AREA
===================================================== */

.search-area{
    margin:20px auto;
    padding:15px;
}

#roll{
    padding:11px;
    width:220px;
    border:1px solid #777;
    border-radius:5px;
    font-size:16px;
}

.search-area button{
    padding:11px 18px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
    font-size:15px;
}

.search-btn{
    background:green;
}

.print-btn{
    background:#333;
}


/* =====================================================
   RESULT
===================================================== */

#result{
    width:100%;
}


/* =====================================================
   RESULT HEADER
===================================================== */

.result-header{
    width:90%;
    margin:20px auto 0;
    background:white;
    border:2px solid black;
    padding:10px;
}

.result-header h2{
    margin:5px;
}

.result-header p{
    margin:5px;
}


/* =====================================================
   STUDENT CARD
===================================================== */

.card{
    display:flex;
    justify-content:space-between;
    align-items:center;

    border:2px solid black;
    border-top:none;

    background:white;

    padding:20px;

    width:90%;

    margin:auto;
}


/* LOGO */

.logo{
    width:20%;
}

.logo img{
    width:120px;
}


/* STUDENT INFO */

.info{
    width:55%;
    text-align:left;
    font-size:18px;
}

.info p{
    margin:8px 0;
}


/* PHOTO */

.photo{
    width:20%;
}

.photo img{
    width:130px;
    height:150px;
    object-fit:cover;
    border:1px solid black;
}


/* =====================================================
   TABLE
===================================================== */

table{
    width:90%;
    margin:20px auto;
    border-collapse:collapse;
    background:white;
}

th,
td{
    border:2px solid black;
    padding:8px;
}

th{
    background:#e5e7eb;
}


/* PASS / FAIL */

.pass{
    background:#d4edda;
}

.fail{
    background:#f8d7da;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:90%;

    margin:20px auto;

    border:1px solid black;

    padding:15px;

    background:white;

    min-height:150px;
}


.summary-info{
    text-align:left;
    line-height:1.5;
}

.summary-info p{
    margin:5px 0;
}


/* =====================================================
   QR CODE
===================================================== */

.qr-section{
    width:140px;
    min-width:140px;

    display:flex;
    justify-content:center;
    align-items:center;
}

#qrcode{

    width:120px;
    height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:90%;

    margin:20px auto;

    border-top:2px solid black;

    padding-top:10px;

}

.footer > div{
    width:30%;
}

.center-text{
    text-align:center;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:30px;

    font-size:22px;

    background:white;

    width:80%;

    margin:20px auto;

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    padding:30px;

    color:red;

    font-size:20px;

    background:white;

    margin:20px auto;

    width:80%;

    border:1px solid #ddd;

}


/* =====================================================
   PRINT
===================================================== */

@media print{

    .no-print{
        display:none !important;
    }

    body{
        background:white;
    }

    .result-header,
    .card,
    table,
    .summary-row,
    .footer{

        width:95%;

    }

    .footer{
        page-break-inside:avoid;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .topnav a{
        padding:8px;
        font-size:13px;
    }


    .card{

        flex-direction:column;

        gap:15px;

    }


    .logo,
    .info,
    .photo{

        width:100%;

        text-align:center;

    }


    .info{
        text-align:left;
    }


    table{

        width:95%;

        font-size:13px;

    }


    th,
    td{

        padding:5px;

    }


    .summary-row{

        flex-direction:column;

        gap:20px;

    }


    .footer{

        flex-direction:column;

        gap:20px;

    }


    .footer > div{

        width:100%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP / NO PRINT
===================================================== -->

<div class="no-print">


    <!-- SCHOOL HEADER -->

    <div class="header">

        GOVERNMENT BOYS HIGH SCHOOL AWERA BAGH

    </div>


    <!-- NAVIGATION -->

    <div class="topnav">

        <a href="login.html">
            🔐 Login
        </a>

        <a href="index.html">

        </a>

        <a href="index(4).html">

        <a href="staff.html">

        <a href="index(2).html">

        </a>

        <a href="date-sheet.html">
            📅 Date-sheet
        </a>

        <a href="gallery.html">

        </a>

    </div>


    <!-- CLASS LINKS -->

    <div class="class-box">

        <a href="index1.html">
            Nursery
        </a>

        <a href="index2.html">
            Prep
        </a>

        <a href="index3.html">

        </a>

        <a href="index4.html">

        <a href="index5.html">

        </a>

        <a href="index7.html">

        </a>

        <a href="index8.html">

        </a>

    </div>


    <!-- TITLE -->

    <h2>
        📥 Download Section (Marks Sheets)
    </h2>


    <!-- SEARCH -->

    <div class="search-area">

        <input
            type="text"
            id="roll"
            placeholder="Enter Roll No"
            autocomplete="off"
        >


        <button
            class="search-btn"
            onclick="getResult()"
        >
            🔍 Search
        </button>


        <button
            class="print-btn"
            onclick="window.print()"
        >
            🖨 Print
        </button>

    </div>


</div>


<!-- =====================================================
     RESULT SYSTEM TITLE
===================================================== -->

<h2 class="no-print">

    Result System 2026

</h2>


<!-- =====================================================
     RESULT OUTPUT
===================================================== -->

<div id="result"></div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyxMKRGwPAh8rm-1z0fJ_s6oPykxI-0m9EuWLp5nzOaWQVziba2zYDp7S1qlPJ4LKdD/exec?roll=";


/* =====================================================
   GRADE
===================================================== */

function getGrade(percent){

    percent = Number(percent) || 0;


    if(percent >= 80)
        return "A+";


    if(percent >= 70)
        return "A";


    if(percent >= 60)
        return "B";


    if(percent >= 50)
        return "C";


    if(percent >= 40)
        return "D";


    return "F";

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(marks, passMarks){

    return Number(marks) >= Number(passMarks)
        ? "Pass"
        : "Fail";

}


/* =====================================================
   NUMBER
===================================================== */

function num(value){

    const n = Number(value);

    return isNaN(n) ? 0 : n;

}


/* =====================================================
   GET RESULT
===================================================== */

function getResult(){


    const rollInput =
        document.getElementById("roll");


    const roll =
        rollInput.value.trim();


    /* EMPTY */

    if(!roll){

        alert("Enter Roll No");

        rollInput.focus();

        return;

    }


    const resultBox =
        document.getElementById("result");


    /* LOADING */

    resultBox.innerHTML = `

        <div class="loading">

            ⏳ Loading Result...

        </div>

    `;


    /* CALLBACK */

    const callbackName =
        "resultCallback_" + Date.now();


    const timeoutName =
        callbackName + "_timeout";


    /* =================================================
       JSONP CALLBACK
    ================================================= */

    window[callbackName] =
        function(data){


            /* CLEAR TIMEOUT */

            clearTimeout(
                window[timeoutName]
            );


            /* DELETE CALLBACK */

            delete window[callbackName];


            console.log(
                "RESULT API:",
                data
            );


            /* ERROR */

            if(!data || data.error){

                resultBox.innerHTML = `

                    <div class="error-box">

                        ❌ ${
                            data && data.error
                            ? data.error
                            : "Result Not Found"
                        }

                    </div>

                `;

                return;

            }


            /* =================================================
               STUDENT INFORMATION
            ================================================= */

            const name =
                data.name || "-";


            const father =
                data.father || "-";


            const studentClass =
                data.class || "-";


            const studentRoll =
                data.roll || roll;


            const position =
                data.position || "-";


            const photo =
                data.photo ||
                "https://via.placeholder.com/130x150?text=Photo";


            /* =================================================
               MARKS
            ================================================= */

            const english =
                num(data.english);


            const urdu =
                num(data.urdu);


            const math =
                num(data.math);


            const nazra =
                num(data.nazra);


            /* =================================================
               TOTAL
            ================================================= */

            const total =
                data.total !== undefined
                ? num(data.total)
                : english + urdu + math + nazra;


            /* =================================================
               MAXIMUM
            ================================================= */

            const maximum = 350;


            /* =================================================
               PERCENTAGE
            ================================================= */

            const percent =
                data.percentage !== undefined
                ? num(data.percentage)
                : (total / maximum) * 100;


            /* =================================================
               GRADE
            ================================================= */

            const grade =
                data.grade || getGrade(percent);


            /* =================================================
               OVERALL STATUS
            ================================================= */

            const overallStatus =
                percent >= 40
                ? "Pass"
                : "Fail";


            /* =================================================
               RESULT HTML
            ================================================= */

            resultBox.innerHTML = `


                <!-- RESULT HEADER -->

                <div class="result-header">

                    <h2>

                        Govt Boys High School Awera Bagh

                    </h2>


                    <p>

                        Annual Examination 2026

                    </p>

                </div>


                <!-- STUDENT CARD -->

                <div class="card">


                    <!-- LOGO -->

                    <div class="logo">

                        <img
                            src="https://i.postimg.cc/hQxgrqW0/logo.png"
                            alt="School Logo"
                        >

                    </div>


                    <!-- INFORMATION -->

                    <div class="info">

                        <p>

                            <b>Name:</b>
                            ${name}

                        </p>


                        <p>

                            <b>Father:</b>
                            ${father}

                        </p>


                        <p>

                            <b>Class:</b>
                            ${studentClass}

                        </p>


                        <p>

                            <b>Roll No:</b>
                            ${studentRoll}

                        </p>


                        <p>

                            <b>Position:</b>
                            ${position}

                        </p>

                    </div>


                    <!-- PHOTO -->

                    <div class="photo">

                        <img
                            src="${photo}"
                            alt="Student Photo"
                            onerror="this.src='https://via.placeholder.com/130x150?text=Photo'"
                        >

                    </div>


                </div>


                <!-- =================================================
                     MARKS TABLE
                ================================================= -->

                <table>


                    <tr>

                        <th>#</th>

                        <th>Subject</th>

                        <th>Total</th>

                        <th>Marks</th>

                        <th>Grade</th>

                        <th>Status</th>

                    </tr>


                    <!-- ENGLISH -->

                    <tr class="${
                        english >= 40
                        ? "pass"
                        : "fail"
                    }">

                        <td>1</td>

                        <td>English</td>

                        <td>100</td>

                        <td>${english}</td>

                        <td>
                            ${getGrade(english)}
                        </td>

                        <td>
                            ${getStatus(english,40)}
                        </td>

                    </tr>


                    <!-- URDU -->

                    <tr class="${
                        urdu >= 40
                        ? "pass"
                        : "fail"
                    }">

                        <td>2</td>

                        <td>Urdu</td>

                        <td>100</td>

                        <td>${urdu}</td>

                        <td>
                            ${getGrade(urdu)}
                        </td>

                        <td>
                            ${getStatus(urdu,40)}
                        </td>

                    </tr>


                    <!-- MATH -->

                    <tr class="${
                        math >= 40
                        ? "pass"
                        : "fail"
                    }">

                        <td>3</td>

                        <td>Math</td>

                        <td>100</td>

                        <td>${math}</td>

                        <td>
                            ${getGrade(math)}
                        </td>

                        <td>
                            ${getStatus(math,40)}
                        </td>

                    </tr>


                    <!-- NAZRA -->

                    <tr class="${
                        nazra >= 20
                        ? "pass"
                        : "fail"
                    }">

                        <td>4</td>

                        <td>Nazra</td>

                        <td>50</td>

                        <td>${nazra}</td>

                        <td>

                            ${
                                getGrade(
                                    (nazra / 50) * 100
                                )
                            }

                        </td>

                        <td>

                            ${getStatus(nazra,20)}

                        </td>

                    </tr>


                    <!-- TOTAL -->

                    <tr>

                        <th colspan="2">

                            Total

                        </th>


                        <th>

                            ${maximum}

                        </th>


                        <th>

                            ${total}

                        </th>


                        <th>

                            ${grade}

                        </th>


                        <th>

                            ${overallStatus}

                        </th>

                    </tr>


                </table>


                <!-- =================================================
                     SUMMARY + QR
                ================================================= -->

                <div class="summary-row">


                    <!-- SUMMARY -->

                    <div class="summary-info">


                        <p>

                            <b>Total:</b>

                            ${total}/${maximum}

                        </p>


                        <p>

                            <b>Percentage:</b>

                            ${percent.toFixed(2)}%

                        </p>


                        <p>

                            <b>Grade:</b>

                            ${grade}

                        </p>


                        <p>

                            <b>Position:</b>

                            ${position}

                        </p>


                        <p>

                            <b>Status:</b>

                            ${overallStatus}

                        </p>


                    </div>


                    <!-- QR -->

                    <div class="qr-section">

                        <div id="qrcode"></div>

                    </div>


                </div>


                <!-- =================================================
                     FOOTER
                ================================================= -->

                <div class="footer">


                    <!-- CONTROLLER -->

                    <div>

                        <img
                            src="https://i.postimg.cc/McctDrt0/file-000000009bb4720881ac3f64217586c2.png"
                            width="120"
                            alt="Controller"
                        >

                        <br>

                        Controller

                    </div>


                    <!-- ERRORS -->

                    <div class="center-text">

                        Errors & Omissions

                        <br>

                        Expected

                    </div>


                    <!-- PRINCIPAL -->

                    <div>

                        _____________________

                        <br>

                        Principal

                        <br>

                        Sign & Stamp

                    </div>


                </div>


            `;


            /* =================================================
               QR CODE
            ================================================= */

            const qrBox =
                document.getElementById("qrcode");


            if(qrBox){


                qrBox.innerHTML = "";


                const qrText =

`Government Boys High School Awera Bagh
Annual Examination 2026

Name: ${name}
Father: ${father}
Class: ${studentClass}
Roll No: ${studentRoll}

Obtained: ${total}
Total: ${maximum}
Percentage: ${percent.toFixed(2)}%
Grade: ${grade}
Position: ${position}
Status: ${overallStatus}`;


                /* CHECK QR LIBRARY */

                if(typeof QRCode !== "undefined"){


                    new QRCode(

                        qrBox,

                        {

                            text:qrText,

                            width:120,

                            height:120,

                            correctLevel:
                                QRCode.CorrectLevel.M

                        }

                    );


                    console.log(
                        "QR CODE CREATED"
                    );


                }else{


                    qrBox.innerHTML = `

                        <div style="
                            width:120px;
                            height:120px;
                            border:2px solid red;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:11px;
                            color:red;
                            text-align:center;
                        ">

                            QR Library
                            <br>
                            Not Loaded

                        </div>

                    `;


                    console.error(
                        "QRCode library not loaded"
                    );

                }

            }


        };


    /* =================================================
       TIMEOUT
    ================================================= */

    window[timeoutName] =
        setTimeout(function(){


            delete window[callbackName];


            resultBox.innerHTML = `

                <div class="error-box">

                    ❌ API response timeout

                    <br><br>

                    Please check Roll No
                    and try again.

                </div>

            `;


        },15000);


    /* =================================================
       JSONP SCRIPT
    ================================================= */

    const script =
        document.createElement("script");


    script.src =
        API +
        encodeURIComponent(roll) +
        "&callback=" +
        callbackName;


    /* =================================================
       API CONNECTION ERROR
    ================================================= */

    script.onerror =
        function(){


            clearTimeout(
                window[timeoutName]
            );


            delete window[callbackName];


            resultBox.innerHTML = `

                <div class="error-box">

                    ❌ Unable to connect
                    to Result API.

                    <br><br>

                    Please try again.

                </div>

            `;

        };


    /* ADD SCRIPT */

    document.body.appendChild(script);


}


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("roll")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                getResult();

            }

        }
    );

</script>
